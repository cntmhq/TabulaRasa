server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Cache hashed Vite build assets aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest must be revalidated.
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Kubernetes-style probes. The frontend has no backing dependency to check,
    # so /readyz collapses to the same answer as /livez. Names match the
    # gomailproxy backend so probe config is identical across both services.
    location = /livez {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location = /readyz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","checks":{"static":"ok"}}';
    }
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","checks":{"static":"ok"}}';
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
